name: Deploy Backend to VM


on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build/Test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/backend
            git fetch --all
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file /opt/apps/deployment/.env.prod -f /opt/apps/backend/docker-compose.yml up -d --build backend
            docker compose --env-file /opt/apps/deployment/.env.prod -f /opt/apps/backend/docker-compose.yml ps
